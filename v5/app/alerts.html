<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Alerts — NASDAQ Vedic V5</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<div class="app">
  <div id="headerWrap"></div>
  <div id="tickerWrap"></div>
  <div id="crashWrap"></div>

  <div class="panel" style="margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <span class="fs-10 text-muted">📅 तिथि:</span>
    <input type="date" id="dateInput" style="background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:6px 12px;border-radius:8px;font-size:12px;outline:none;">
    <button class="btn" onclick="loadPage()">▶ लोड</button>
    <button class="btn-outline" onclick="setToday()">📆 आज</button>
    <div id="alertCount" style="margin-left:auto;font-size:11px;color:var(--gold);font-weight:700;"></div>
  </div>

  <!-- SEVERITY FILTER -->
  <div class="panel" style="margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <span class="fs-10 text-muted">फ़िल्टर:</span>
    <button class="btn" id="filterAll"    onclick="filterAlerts('all')"   >सभी</button>
    <button class="btn-outline" id="filterP1" onclick="filterAlerts('P1')">🔴 P1 उच्च</button>
    <button class="btn-outline" id="filterP2" onclick="filterAlerts('P2')">🟡 P2 मध्यम</button>
    <button class="btn-outline" id="filterP3" onclick="filterAlerts('P3')">🟢 P3 सामान्य</button>
    <button class="btn-outline" id="filterCrash" onclick="filterAlerts('crash')">🚨 Crash</button>
  </div>

  <!-- P1 HIGH PRIORITY -->
  <div class="panel" style="margin-bottom:10px;" id="p1Section">
    <div class="panel-title">🔴 P1 — उच्च प्राथमिकता अलर्ट</div>
    <div id="p1Alerts"></div>
  </div>

  <!-- P2 MEDIUM -->
  <div class="panel" style="margin-bottom:10px;" id="p2Section">
    <div class="panel-title">🟡 P2 — मध्यम अलर्ट</div>
    <div id="p2Alerts"></div>
  </div>

  <!-- P3 LOW -->
  <div class="panel" style="margin-bottom:10px;" id="p3Section">
    <div class="panel-title">🟢 P3 — सामान्य अलर्ट</div>
    <div id="p3Alerts"></div>
  </div>

  <!-- CRASH REGIME -->
  <div id="crashSection" class="panel" style="margin-bottom:10px;display:none;">
    <div class="panel-title">🚨 Crash Regime Windows</div>
    <div id="crashAlertsList"></div>
  </div>

  <!-- TIME WINDOWS FULL -->
  <div class="panel" style="margin-bottom:10px;">
    <div class="panel-title">⏰ सभी Time Windows — Start / Peak / End (IST)</div>
    <div id="allTimeWin"></div>
  </div>

  <div class="disclaimer">⚠️ अलर्ट ज्योतिषीय संकेत हैं। बाज़ार जोखिमों के अधीन।</div>
  <div class="footer">NASDAQ Vedic V5 | Alerts | Jai Hind 🇮🇳</div>
</div>

<script src="../engine/config.js"></script>
<script src="../assets/js/router.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
if(!ROUTER.gate()) throw new Error('Build incomplete');
let currentDate = ROUTER.getDateParam();
let allAlerts = [];

function setToday(){ currentDate=ROUTER.todayIST(); document.getElementById('dateInput').value=currentDate; loadPage(); }

function renderAlertItem(a){
  const sevCls = a.severity==='P1'?'imp-p1':a.severity==='P2'?'imp-p2':'imp-p3';
  const icon = a.type==='SOLAR_ECLIPSE'?'🌑':a.type==='LUNAR_ECLIPSE'?'🌕':
               a.type==='CONJUNCTION'?'✨':a.type==='INGRESS'?'🌐':
               a.type==='CRASH_REGIME'?'🚨':'🔔';
  const tags = (a.tags||[]).map(t=>`<span style="background:rgba(124,111,255,.1);color:var(--accent2);font-size:8px;padding:1px 6px;border-radius:4px;margin-left:3px;">${t}</span>`).join('');
  return `<div class="alert-item">
    <div class="alert-time">${a.startIST||a.peakIST||'--'}</div>
    <div style="font-size:16px;flex-shrink:0;">${icon}</div>
    <div class="alert-body">
      <div class="alert-name">${a.label||a.type||'--'}${tags}</div>
      <div class="alert-desc">${(a.notes||[])[0]||'--'}</div>
      <div style="display:flex;gap:6px;margin-top:4px;font-size:9px;color:var(--muted);">
        <span>▶ ${a.startIST||'--'}</span>
        <span>⚡ ${a.peakIST||'--'}</span>
        <span>⏹ ${a.endIST||'--'}</span>
      </div>
      ${a.probability!==undefined?`<div style="font-size:9px;color:var(--red);margin-top:2px;">जोखिम: ${a.probability}% | ${a.disclaimer||''}</div>`:''}
    </div>
    <div class="alert-imp ${sevCls}">${a.severity||'P3'}</div>
  </div>`;
}

function filterAlerts(type){
  ['filterAll','filterP1','filterP2','filterP3','filterCrash'].forEach(id=>{
    document.getElementById(id).className = id.replace('filter','filter')==='filter'+type.charAt(0).toUpperCase()+type.slice(1)||type==='all'&&id==='filterAll'?'btn':'btn-outline';
  });
  document.getElementById('p1Section').style.display = (type==='all'||type==='P1')?'':'none';
  document.getElementById('p2Section').style.display = (type==='all'||type==='P2')?'':'none';
  document.getElementById('p3Section').style.display = (type==='all'||type==='P3')?'':'none';
  document.getElementById('crashSection').style.display = (type==='all'||type==='crash')&&allAlerts.some(a=>a.type==='CRASH_REGIME')?'':'none';
}

async function loadPage(){
  UI.renderHeader('headerWrap','alerts',currentDate);
  document.getElementById('dateInput').value=currentDate;

  const data = await ROUTER.loadJSON(currentDate,'alerts.json');
  if(!data){ UI.showError('p1Alerts','alerts.json उपलब्ध नहीं'); return; }

  allAlerts = data.alerts||[];
  const p1 = allAlerts.filter(a=>a.severity==='P1');
  const p2 = allAlerts.filter(a=>a.severity==='P2');
  const p3 = allAlerts.filter(a=>a.severity==='P3');
  const crashes = allAlerts.filter(a=>a.type==='CRASH_REGIME');

  document.getElementById('alertCount').textContent = `कुल: ${allAlerts.length} अलर्ट | 🔴${p1.length} 🟡${p2.length} 🟢${p3.length}`;

  document.getElementById('p1Alerts').innerHTML = p1.length ? p1.map(renderAlertItem).join('') : '<div style="color:var(--muted);font-size:10px;">कोई P1 अलर्ट नहीं।</div>';
  document.getElementById('p2Alerts').innerHTML = p2.length ? p2.map(renderAlertItem).join('') : '<div style="color:var(--muted);font-size:10px;">कोई P2 अलर्ट नहीं।</div>';
  document.getElementById('p3Alerts').innerHTML = p3.length ? p3.map(renderAlertItem).join('') : '<div style="color:var(--muted);font-size:10px;">कोई P3 अलर्ट नहीं।</div>';

  if(crashes.length){
    document.getElementById('crashSection').style.display='';
    document.getElementById('crashAlertsList').innerHTML = crashes.map(renderAlertItem).join('');
  }

  // All time windows
  const windows = allAlerts.flatMap(a=>a.startIST?[{label:a.label||a.type,startIST:a.startIST,peakIST:a.peakIST||a.startIST,endIST:a.endIST||a.startIST,severity:a.severity,tags:a.tags||[],notes:a.notes||[]}]:[]);
  UI.renderTimeWindows('allTimeWin', windows.slice(0,8));

  // Crash
  UI.renderCrashAlert('crashWrap', crashes);

  UI.renderTicker('tickerWrap',[
    `🔔 कुल अलर्ट: ${allAlerts.length} | 🔴P1:${p1.length} 🟡P2:${p2.length} 🟢P3:${p3.length}`,
    ...p1.slice(0,2).map(a=>`⚡ ${a.label||a.type}: ${(a.notes||[])[0]||''}`),
    crashes.length?`🚨 Crash Regime: ${crashes[0]?.probability||0}% जोखिम`:'',
  ].filter(Boolean));
}
window.addEventListener('load',loadPage);
</script>
</body>
</html>
