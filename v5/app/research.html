<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Ledger — NASDAQ Vedic V5</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><div class="app"><div id="headerWrap"></div><div id="tickerWrap"></div><div class="panel" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;"><span>📅 तिथि:</span><input type="date" id="dateInput"><button class="btn" onclick="loadPage()">▶ लोड</button><button class="btn-outline" onclick="setToday()">📆 आज</button></div><div class="panel"><div class="panel-title">🔬 US Market Research Ledger</div><div id="method"></div><div id="evidence"></div></div><div class="panel"><div class="panel-title">📊 Historical Validation / Backtest</div><div id="backtest"></div></div><div class="panel"><div class="panel-title">⚠️ Limitations and Next Validation Step</div><div id="limits"></div></div><div class="disclaimer">यह research ledger है, verified trading performance नहीं। US futures OHLC, slippage और fees के बिना accuracy claim नहीं किया गया है।</div><div class="footer">NASDAQ Vedic V5 | US Research Ledger</div></div><script src="../engine/config.js"></script><script src="../assets/js/router.js"></script><script src="../assets/js/ui.js"></script><script>let date=ROUTER.getDateParam();function setToday(){date=ROUTER.todayIST();document.getElementById('dateInput').value=date;loadPage()}async function loadPage(){date=document.getElementById('dateInput').value||date;document.getElementById('dateInput').value=date;UI.renderHeader('headerWrap','research',date);const r=await ROUTER.loadJSON(date,'research.json');if(!r){UI.showError('method','research.json उपलब्ध नहीं');return}document.getElementById('method').innerHTML='<div style="font-size:11px;color:var(--muted);margin-bottom:10px;">'+r.methodology+' | Date: '+r.dateIST+'</div>';document.getElementById('evidence').innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;">'+r.evidence.map(e=>'<div class="card"><strong>'+e.source+'</strong><br>Weight: '+(e.weight*100).toFixed(0)+'% | Score: '+(e.score??'--')+'<br>Direction: '+e.direction+'<br><span class="fs-9 text-muted">'+e.status+' — '+e.note+'</span></div>').join('')+'</div>';document.getElementById('backtest').innerHTML='<div class="card">Status: '+r.backtest.status+'<br>Samples: '+r.backtest.sampleCount+' | Accuracy: '+(r.backtest.accuracy??'--')+'%<br><span class="fs-9 text-muted">'+r.backtest.note+'</span></div>';document.getElementById('limits').innerHTML='<ul>'+r.limitations.map(x=>'<li>'+x+'</li>').join('')+'</ul><strong>Next:</strong> '+r.nextValidation;UI.renderTicker('tickerWrap',['🔬 Research: OHLC validation '+r.backtest.status])}window.addEventListener('load',loadPage)</script></body></html>
